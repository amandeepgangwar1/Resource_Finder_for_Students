<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | Student Resource Finder</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="card auth-card">
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <p class="eyebrow" style="margin-bottom: 0.25rem;">Recovery</p>
    <h2 style="margin: 0; font-size: 1.6rem;">Reset Password</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Enter your email to receive recovery instructions</p>
  </div>

  <form id="forgotPasswordForm">
    <div class="form-group">
      <label for="email">Registered Email</label>
      <input type="email" id="email" placeholder="student@university.edu" required>
    </div>
    <button type="submit" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem;">
      Send Reset Link
    </button>
  </form>

  <p id="message" class="status-message" aria-live="polite" style="display: none;"></p>

  <div id="resetLinkPanel" class="status-message info" hidden style="margin-top: 1rem;">
    <p style="margin-bottom: 0.5rem; font-size: 0.85rem;">Local development reset link (valid 30 min):</p>
    <p style="margin: 0;"><a id="resetLink" href="reset-password.html" style="font-weight: 700;">Proceed to reset password →</a></p>
  </div>

  <div class="auth-links">
    <p><a href="login.html">← Back to login</a></p>
  </div>
</div>

<footer class="app-footer" style="background: transparent; border: 0;">
  <p>© 2026 Student Resource Finder Platform by Amandeep Gangwar</p>
</footer>

<script src="config.js"></script>
<script>
const API = window.resourceFinderApiBase();

document.getElementById("forgotPasswordForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = document.getElementById("message");
  const resetLinkPanel = document.getElementById("resetLinkPanel");
  const resetLink = document.getElementById("resetLink");
  const submitButton = event.currentTarget.querySelector("button[type='submit']");

  message.style.display = "block";
  message.className = "status-message info";
  message.textContent = "Creating reset link...";
  resetLinkPanel.hidden = true;
  submitButton.disabled = true;

  try {
    const response = await fetch(`${API}/auth/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: document.getElementById("email").value })
    });
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Unable to create reset link");
    }

    message.className = "status-message success";
    message.textContent = data.message;
    if (data.devResetUrl) {
      resetLink.href = data.devResetUrl;
      resetLinkPanel.hidden = false;
    }
  } catch (error) {
    message.className = "status-message error";
    message.textContent = error.message;
  } finally {
    submitButton.disabled = false;
  }
});
</script>

</body>
</html>
