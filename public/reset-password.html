<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Student Resource Finder</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="card auth-card">
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <span class="source-icon source-cls" style="width: 44px; height: 44px; margin: 0 auto 0.75rem auto;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </span>
    <p class="eyebrow" style="margin-bottom: 0.25rem;">Security</p>
    <h2 style="margin: 0; font-size: 1.6rem;">Set New Password</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Choose a secure password for your account</p>
  </div>

  <form id="resetPasswordForm">
    <div class="form-group">
      <label for="email">Account Email</label>
      <input type="email" id="email" placeholder="student@university.edu" required>
    </div>

    <div class="form-group">
      <label for="token">Reset Token or 6-digit Code</label>
      <input type="text" id="token" placeholder="Paste reset token or enter 6-digit code" required>
    </div>

    <div class="form-group">
      <label for="password">New Password</label>
      <div class="password-input-wrap">
        <input type="password" id="password" placeholder="At least 8 chars, 1 uppercase, 1 lowercase, 1 digit" required minlength="8">
        <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm New Password</label>
      <div class="password-input-wrap">
        <input type="password" id="confirmPassword" placeholder="Re-enter new password" required minlength="8">
        <button type="button" class="password-toggle-btn" id="toggleConfirmBtn" aria-label="Toggle confirm password visibility">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <p id="matchError" style="font-size: 0.78rem; color: var(--danger); margin: 0.2rem 0 0; display: none;">Passwords do not match.</p>
    </div>

    <button type="submit" id="submitBtn" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
      Update Password
    </button>
  </form>

  <p id="message" class="status-message" aria-live="polite" style="display: none;"></p>

  <div class="auth-links">
    <p><a href="login.html">← Back to login</a></p>
  </div>
</div>

<footer class="app-footer" style="background: transparent; border: 0;">
  <p>© 2026 Student Resource Finder Platform by Amandeep Gangwar</p>
</footer>

<script src="config.js"></script>
<script>
const API = window.resourceFinderApiBase();
const params = new URLSearchParams(window.location.search);

document.getElementById("email").value = params.get("email") || "";
document.getElementById("token").value = params.get("token") || params.get("code") || "";

function setupToggle(btnId, inputId) {
  const btn = document.getElementById(btnId);
  const input = document.getElementById(inputId);
  btn.addEventListener("click", () => {
    const isPassword = input.type === "password";
    input.type = isPassword ? "text" : "password";
    btn.innerHTML = isPassword
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
      : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
  });
}

setupToggle("togglePasswordBtn", "password");
setupToggle("toggleConfirmBtn", "confirmPassword");

const pwdInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");
const matchError = document.getElementById("matchError");

confirmInput.addEventListener("input", () => {
  if (confirmInput.value && pwdInput.value !== confirmInput.value) {
    matchError.style.display = "block";
  } else {
    matchError.style.display = "none";
  }
});

document.getElementById("resetPasswordForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = document.getElementById("message");
  const submitButton = document.getElementById("submitBtn");
  const email = document.getElementById("email").value.trim();
  const token = document.getElementById("token").value.trim();
  const password = pwdInput.value;
  const confirmPassword = confirmInput.value;

  if (password !== confirmPassword) {
    matchError.style.display = "block";
    confirmInput.focus();
    return;
  }

  message.style.display = "block";
  message.className = "status-message info";
  message.textContent = "Updating password...";
  submitButton.disabled = true;

  try {
    const response = await fetch(`${API}/auth/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, token, password })
    });
    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.message || "Unable to reset password");
    }

    message.className = "status-message success";
    message.innerHTML = `${data.message}. Redirecting to login...`;
    setTimeout(() => {
      window.location.href = "login.html";
    }, 1500);
  } catch (error) {
    message.className = "status-message error";
    message.textContent = error.message;
  } finally {
    submitButton.disabled = false;
  }
});
</script>

</body>
</html>
