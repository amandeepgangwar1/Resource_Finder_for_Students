<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Student Resource Finder</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="card auth-card">
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <span class="source-icon source-pdf" style="width: 44px; height: 44px; margin: 0 auto 0.75rem auto; background: var(--primary-light); color: var(--primary);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
    </span>
    <p class="eyebrow" style="margin-bottom: 0.25rem;">Staff Access</p>
    <h2 style="margin: 0; font-size: 1.6rem;">Administrator Login</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Sign in with authorized staff credentials</p>
  </div>

  <form id="adminLoginForm">
    <div class="form-group">
      <label for="adminEmail">Admin Email</label>
      <input type="email" id="adminEmail" placeholder="admin@university.edu" required autocomplete="email">
    </div>

    <div class="form-group">
      <label for="adminPassword">Password</label>
      <div class="password-input-wrap">
        <input type="password" id="adminPassword" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="password-toggle-btn" id="toggleAdminPwdBtn" aria-label="Toggle password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
      Login to Console
    </button>
  </form>

  <p id="adminLoginMessage" class="status-message" aria-live="polite" style="display: none;"></p>

  <div class="auth-links">
    <p>Need admin access? <a href="admin-register.html"><strong>Admin Registration</strong></a></p>
    <p style="font-size: 0.82rem; color: var(--text-muted);">Student or teacher? <a href="login.html">User Portal Login</a></p>
    <p style="font-size: 0.82rem;"><a href="index.html">← Back to home</a></p>
  </div>
</div>

<footer class="app-footer" style="background: transparent; border: 0;">
  <p>© 2026 Student Resource Finder Platform by Amandeep Gangwar</p>
</footer>

<script src="config.js"></script>
<script>
const API = window.resourceFinderApiBase();

const pwdField = document.getElementById("adminPassword");
const toggleBtn = document.getElementById("toggleAdminPwdBtn");
toggleBtn.addEventListener("click", () => {
  const isPwd = pwdField.type === "password";
  pwdField.type = isPwd ? "text" : "password";
  toggleBtn.innerHTML = isPwd
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
});

document.getElementById("adminLoginForm").addEventListener("submit", async e => {
  e.preventDefault();

  const email = document.getElementById("adminEmail").value.trim();
  const password = pwdField.value;
  const messageEl = document.getElementById("adminLoginMessage");
  const submitBtn = e.currentTarget.querySelector("button[type='submit']");

  messageEl.style.display = "block";
  messageEl.textContent = "Verifying admin credentials...";
  messageEl.className = "status-message info";
  submitBtn.disabled = true;

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {
      if (data.user.role !== "admin") {
        messageEl.textContent = "This account does not have administrator privileges. Use the regular student portal.";
        messageEl.className = "status-message error";
        return;
      }

      localStorage.setItem("token", data.token);
      messageEl.textContent = `✓ Logged in successfully. Welcome, ${data.user.name}!`;
      messageEl.className = "status-message success";
      setTimeout(() => {
        window.location.href = "admin.html";
      }, 800);
    } else {
      messageEl.textContent = data.message || "Admin login failed";
      messageEl.className = "status-message error";
    }
  } catch (error) {
    messageEl.textContent = "Network error: " + error.message;
    messageEl.className = "status-message error";
  } finally {
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
