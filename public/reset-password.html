<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Student Resource Finder</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="card auth-card">
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <p class="eyebrow" style="margin-bottom: 0.25rem;">Security</p>
    <h2 style="margin: 0; font-size: 1.6rem;">Set New Password</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Choose a secure password for your account</p>
  </div>

  <form id="resetPasswordForm">
    <div class="form-group">
      <label for="email">Account Email</label>
      <input type="email" id="email" placeholder="student@university.edu" required>
    </div>
    <div class="form-group">
      <label for="token">Reset Token</label>
      <input type="text" id="token" placeholder="Paste reset token" required>
    </div>
    <div class="form-group">
      <label for="password">New Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6">
    </div>
    <button type="submit" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem;">
      Update Password
    </button>
  </form>

  <p id="message" class="status-message" aria-live="polite" style="display: none;"></p>

  <div class="auth-links">
    <p><a href="login.html">← Back to login</a></p>
  </div>
</div>

<footer class="app-footer" style="background: transparent; border: 0;">
  <p>© 2026 Student Resource Finder Platform by Amandeep Gangwar</p>
</footer>

<script src="config.js"></script>
<script>
const API = window.resourceFinderApiBase();
const params = new URLSearchParams(window.location.search);

document.getElementById("email").value = params.get("email") || "";
document.getElementById("token").value = params.get("token") || "";

document.getElementById("resetPasswordForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = document.getElementById("message");
  const submitButton = event.currentTarget.querySelector("button[type='submit']");

  message.style.display = "block";
  message.className = "status-message info";
  message.textContent = "Updating password...";
  submitButton.disabled = true;

  try {
    const response = await fetch(`${API}/auth/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        token: document.getElementById("token").value,
        password: document.getElementById("password").value
      })
    });
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Unable to reset password");
    }

    message.className = "status-message success";
    message.innerHTML = `${data.message}. <a href="login.html" style="font-weight: 700;">Login now →</a>`;
    event.currentTarget.reset();
  } catch (error) {
    message.className = "status-message error";
    message.textContent = error.message;
  } finally {
    submitButton.disabled = false;
  }
});
</script>

</body>
</html>
