<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Library | Student Resource Finder</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <a class="brand-mark" href="index.html">
      <span class="source-icon source-cls" style="width: 34px; height: 34px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </span>
      <strong>Student Resource Finder</strong>
    </a>
    <nav class="nav-links" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="search.html">Search</a>
      <a href="library.html" aria-current="page">Library</a>
      <a href="results.html">Results</a>
      <a href="upload.html">Upload</a>
      <a class="auth-logged-out" href="login.html">Login</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="admin.html">Admin</a>
      <button class="link-button auth-logged-in" data-auth-action="logout" type="button">Logout</button>
    </nav>
  </header>

  <main class="section-page">
    <section class="surface library-panel page-section-card" id="libraryPanel">
      <div class="section-heading inline-heading">
        <div>
          <p class="eyebrow">Repository</p>
          <h1>Campus Document Library</h1>
          <p>Browse and preview notes, study materials, and past papers uploaded by students and faculty.</p>
        </div>
        <span class="count-pill"><span id="localCount">0</span> total files</span>
      </div>
      <ul id="localResults" class="resource-list page-resource-list"></ul>
    </section>
  </main>

  <footer class="app-footer">
    <p>© 2026 Student Resource Finder Platform by Amandeep Gangwar</p>
  </footer>

  <script src="config.js"></script>
  <script>
    if (!localStorage.getItem("token")) {
      window.location.href = "login.html";
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
